name: Deploy to GitHub Pages

# SPEC DSH.DEPLOY.PAGES.01 — the legacy "deploy from branch" Pages build stalled on the deploy step
# (10-min timeout) from v471 onward, leaving production stuck at v470. This publishes main's repo root
# via the GitHub Actions Pages path (configure-pages → upload-pages-artifact → deploy-pages), which is
# a different, reliable publish pipeline. No app code / chart / UI / finance logic is touched.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scopes required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-flight run finish (don't cancel a live deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # SPEC CHART-INTEGRITY.CI — fail-closed deploy gate. Runs the full chart-engine harness suite (P0
  # chart-integrity harnesses first). Any red harness fails this job; `deploy` depends on it, so a
  # failing suite blocks the publish. No continue-on-error, no ignored exit codes.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Chart-integrity certification gate
        run: node scripts/aurix-ci-gate.mjs

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # M.06 · SUPERFICIE DE RELEASE — P0. Esto subía `path: '.'`, y como `.nojekyll` desactiva el
      # filtrado de Jekyll, el REPO ENTERO quedaba publicado en el dominio del cliente. Verificado en
      # vivo con HTTP 200 sobre CLAUDE.md, db/supabase_rls.sql, el checklist pre-LIVE de M.04 (con una
      # dirección real del founder), api/billing/webhook.mjs, los runbooks de db/m04_prod/ con price IDs
      # de Stripe y .claude/agents/. Sin credenciales expuestas, pero sí el mapa de la frontera de
      # autorización y material interno en la puerta del producto — y páginas de diagnóstico como
      # boot-check.html, que borra el almacenamiento local sin confirmación ni auth.
      # Ahora se publica un ensamblado por ALLOWLIST que además FALLA CERRADO si una referencia local
      # de un HTML no resuelve o si se cuela material interno: olvidar un asset bloquea el deploy en
      # vez de romper producción en silencio. `api/` y `landing/` los sirve Vercel, no Pages.
      - name: Assemble publishable site (allowlist, fail-closed)
        run: node scripts/aurix-build-site.mjs _site
      - name: Upload artifact (publishable site only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
